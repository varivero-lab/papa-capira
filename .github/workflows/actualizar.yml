name: Actualizar precios SIPSA

on:
  schedule:
    - cron: "0 14 * * 6"   # sábados 9:00 a. m. hora de Colombia (el DANE publica los viernes)
  workflow_dispatch:        # botón para ejecutarlo a mano desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - run: python actualizar_sipsa.py --anio "$(date +%Y)"   # revisa la página principal y el histórico del año; solo descarga anexos nuevos
      - name: Guardar datos nuevos
        run: |
          git config user.name "actualizador-sipsa"
          git config user.email "actions@users.noreply.github.com"
          git add datos.json
          git diff --cached --quiet || git commit -m "Datos SIPSA $(date +%F)"
          git push
